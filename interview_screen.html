<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interview UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter, Arial, sans-serif;
}

body{
    background:#090713;
    color:white;
    min-height:100vh;
    padding:24px;
}

.container{
    max-width:1600px;
    margin:auto;
    display:grid;
    grid-template-columns:3fr 1fr;
    gap:24px;
}

/* General Cards */
.card{
    background:linear-gradient(145deg,#141022,#0b0915);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:24px;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

/* Header */
.header{
    padding:24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
}

.brand{
    display:flex;
    align-items:center;
    gap:18px;
}

.icon{
    width:60px;
    height:60px;
    border-radius:18px;
    background:rgba(139,92,246,0.15);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
}

.subtext{
    color:#8a8a98;
    font-size:14px;
    margin-top:6px;
}

.timer h2{
    font-size:32px;
}

/* Video */
.video-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    margin-bottom:24px;
}

.video-card{
    aspect-ratio:4/5;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    color:#aaa;
    font-size:18px;
}

/* Question */
.question-box{
    padding:40px;
    margin-bottom:24px;
}

.question-box p{
    color:#8b5cf6;
    margin-bottom:14px;
    font-size:14px;
}

.question-box h2{
    font-size:40px;
    line-height:1.3;
}

/* Controls */
.controls{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:24px;
}

.btn{
    padding:18px;
    border:none;
    border-radius:16px;
    background:#130f24;
    color:white;
    cursor:pointer;
}

/* Chat */
.chat-box{
    padding:24px;
}

.chat-title{
    font-size:22px;
    margin-bottom:20px;
}

.chat-messages{
    height:300px;
    overflow-y:auto;
    border-radius:18px;
    background:rgba(255,255,255,0.03);
    padding:18px;
    margin-bottom:18px;
}

.message{
    padding:14px 18px;
    border-radius:18px;
    margin-bottom:14px;
    width:fit-content;
    max-width:70%;
}

.ai-msg{
    background:rgba(139,92,246,0.15);
}

.user-msg{
    background:rgba(255,255,255,0.08);
    margin-left:auto;
}

.chat-input-wrap{
    display:flex;
    gap:12px;
}

.chat-input{
    flex:1;
    padding:16px;
    border:none;
    outline:none;
    border-radius:16px;
    background:rgba(255,255,255,0.05);
    color:white;
}

.send-btn{
    background:#8b5cf6;
    border:none;
    border-radius:16px;
    color:white;
    padding:0 28px;
    cursor:pointer;
}

/* Sidebar */
.sidebar{
    display:flex;
    flex-direction:column;
    height:100%;
}

.metric{
    padding:24px;
    margin-bottom:24px;
}

.progress{
    height:8px;
    margin-top:12px;
    background:rgba(255,255,255,0.05);
    border-radius:999px;
    overflow:hidden;
}

.fill{
    width:75%;
    height:100%;
    background:#8b5cf6;
}

/* End call */
.end-call-wrap{
    margin-top:auto;
}

.end-call-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:16px;
    background:linear-gradient(90deg,#ff4d6d,#d7263d);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.end-call-btn:hover{
    transform:translateY(-2px);
}

/* Responsive */
@media(max-width:1100px){

    .container{
        grid-template-columns:1fr;
    }

    .video-grid{
        grid-template-columns:1fr;
    }

    .controls{
        grid-template-columns:1fr 1fr;
    }

}
</style>
</head>

<body>

<div class="container">

    <!-- Left -->
    <div>

        <div class="card header">
            <div class="brand">
                <div class="icon">🤖</div>
                <div>
                    <h1>Frontend Developer Mock Interview</h1>
                    <div class="subtext">Technical Round</div>
                </div>
            </div>

            <div class="timer">
                <div class="subtext">Interview Time</div>
                <h2>12:45</h2>
            </div>
        </div>

        <div class="video-grid">
            <div class="card video-card"><img width="400px" src="ChatGPT Image May 13, 2026, 11_50_52 PM.png" alt="">AI Interviewer</div>
            <div class="card video-card"><img width="400px" src="ChatGPT Image May 14, 2026, 08_20_19 AM.png" alt="">You</div>
        </div>

        <div class="card question-box">
            <p>Current Question</p>
            <h2>Tell me about a challenging project you worked on and how you solved it.</h2>
        </div>

        <div class="controls">
            <button class="btn">🎤 Mic</button>
            <button class="btn">📷 Camera</button>
            <button class="btn">🔊 Audio</button>
            <button class="btn">⏸ Pause</button>
        </div>

        <div class="card chat-box">

            <div class="chat-title">Interview Chat</div>

            <div class="chat-messages" id="chatMessages">
                <div class="message ai-msg">
                    Use STAR method for answering.
                </div>
            </div>

            <div class="chat-input-wrap">
                <input 
                    id="chatInput" 
                    class="chat-input" 
                    placeholder="Type message..."
                >

                <button 
                    class="send-btn"
                    onclick="sendMessage()"
                >
                    Send
                </button>
            </div>

        </div>

    </div>

    <!-- Right Sidebar -->
    <div class="sidebar">

        <div class="card metric">
            Confidence
            <div class="progress"><div class="fill"></div></div>
        </div>

        <div class="card metric">
            Speech Clarity
            <div class="progress"><div class="fill"></div></div>
        </div>

        <div class="card metric">
            Eye Contact
            <div class="progress"><div class="fill"></div></div>
        </div>

        <div class="card metric">
            Response Length
            <div class="progress"><div class="fill"></div></div>
        </div>

        <!-- Bottom CTA -->
        <div class="end-call-wrap">
            <button 
                class="end-call-btn"
                onclick="endInterview()"
            >
                📞 End Interview
            </button>
        </div>

    </div>

</div>

<script>

function sendMessage(){

    const input = document.getElementById("chatInput");
    const container = document.getElementById("chatMessages");

    if(input.value.trim() === "") return;

    const msg = document.createElement("div");

    msg.className = "message user-msg";
    msg.innerText = input.value;

    container.appendChild(msg);

    container.scrollTop = container.scrollHeight;

    input.value = "";

}

function endInterview(){
    alert("Interview ended");
}

</script>

</body>
</html>
